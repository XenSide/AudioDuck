<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="sdpi.css" />
	<style>
		.list .sdpi-item-child { display: block !important; overflow-wrap: anywhere; }
		.list { max-height: 150px; overflow-y: auto; }
		.note { opacity: .7; }
		.error { color: #ffb367; }
		.apps { display: grid; grid-template-columns: 1fr; gap: 4px; }
		.app { display: grid; grid-template-columns: 76px 1fr 64px; align-items: center; gap: 6px; }
		.app .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.bar { height: 5px; background: #3d3d3d; border-radius: 3px; overflow: hidden; }
		.bar > div { height: 100%; background: #d8d8d8; }
		.bar.loud > div { background: #ffb367; }
		.vol { text-align: right; opacity: .7; }
		.vol.down { color: #ffb367; opacity: 1; }
	</style>
</head>
<body>
	<div class="sdpi-wrapper">
		<div class="sdpi-item">
			<div class="sdpi-item-label empty"></div>
			<div class="sdpi-item-value note" id="status">…</div>
		</div>

		<div id="editor"></div>

		<div class="sdpi-heading">Style</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label">Style</div>
			<select class="sdpi-item-value select" id="style">
				<option value="default">Default</option>
				<option value="duotone">Duotone</option>
			</select>
		</div>
		<div class="sdpi-item" id="duoItem" style="display:none;">
			<div class="sdpi-item-label">Colour</div>
			<select class="sdpi-item-value select" id="duoPreset">
				<option value="blue">Blue</option>
				<option value="orange">Orange</option>
				<option value="purple">Purple</option>
				<option value="red">Red</option>
				<option value="custom">Custom…</option>
			</select>
		</div>
		<div class="sdpi-item" type="color" id="duoCustom" style="display:none;">
			<div class="sdpi-item-label">Custom</div>
			<div class="sdpi-item-value" style="display:flex;gap:8px;align-items:center;">
				<input type="color" id="duoBg" value="#3b4c66" title="Background" />
				<input type="color" id="duoAccent" value="#67a4ff" title="Accent" />
			</div>
		</div>

		<div class="sdpi-heading">Apps playing</div>
		<div class="sdpi-item">
			<div class="sdpi-item-label empty"></div>
			<div class="sdpi-item-value apps" id="apps"><span class="note">No app is playing audio.</span></div>
		</div>

		<div class="sdpi-heading">Timing (shared by all keys)</div>
		<div class="sdpi-item" type="range" title="Bars turn orange above the threshold">
			<div class="sdpi-item-label">Threshold</div>
			<div class="sdpi-item-value">
				<input type="range" id="threshold" min="1" max="30" style="flex:1;min-width:0;width:auto;" /><span id="thresholdPct" style="min-width:3em;"></span>
			</div>
		</div>
		<div class="sdpi-item"><div class="sdpi-item-label">Fade down</div><input class="sdpi-item-value" type="number" id="attack_ms" min="0" max="5000" step="10" placeholder="ms" /></div>
		<div class="sdpi-item"><div class="sdpi-item-label">Hold</div><input class="sdpi-item-value" type="number" id="hold_ms" min="0" max="5000" step="10" placeholder="ms" /></div>
		<div class="sdpi-item"><div class="sdpi-item-label">Fade up</div><input class="sdpi-item-value" type="number" id="release_ms" min="0" max="5000" step="10" placeholder="ms" /></div>
		<div class="sdpi-item">
			<div class="sdpi-item-label empty"></div>
			<div class="sdpi-item-value note">Times in milliseconds. Hold keeps the volume down through short pauses before fading back up. Tap the key to turn its rule off and on.</div>
		</div>
	</div>

<script>
	let ws, uuid, settings = {}, config = null, live = { peaks: [], gains: {}, volumes: {}, active_rules: [] };
	let draft = null, draftFor = undefined; // editor state, rebuilt only when the key's rule changes
	let uid = 0; // ids for checkbox/label pairs
	const $ = (id) => document.getElementById(id);
	const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
	const pretty = (app) => { const s = app.replace(/\.exe$/, ''); return s.charAt(0).toUpperCase() + s.slice(1); };
	const ruleOf = () => config && config.rules.find((r) => r.id === settings.rule);

	window.connectElgatoStreamDeckSocket = (port, inUUID, registerEvent, info, actionInfo) => {
		uuid = inUUID;
		try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch { settings = {}; }
		styleToUi();
		ws = new WebSocket('ws://127.0.0.1:' + port);
		ws.onopen = () => {
			ws.send(JSON.stringify({ event: registerEvent, uuid }));
			send('sendToPlugin', {}); // ask for the config
		};
		ws.onmessage = (e) => {
			const m = JSON.parse(e.data);
			if (m.event !== 'sendToPropertyInspector') return;
			if (m.payload.config) { config = m.payload.config; renderConfig(); }
			if (m.payload.live) { live = m.payload.live; renderLive(); }
		};
	};

	function send(event, payload) {
		if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event, context: uuid, payload }));
	}
	const save = () => send('sendToPlugin', { config, rule: settings.rule }); // the key's rule: the plugin deletes rules no key uses
	const saveSettings = () => send('setSettings', settings);

	function setRule(id) {
		settings.rule = id;
		saveSettings();
		renderConfig();
	}

	function renderConfig() {
		if (!config) return;
		const s = config.settings;
		$('threshold').value = Math.round(s.threshold * 100);
		$('thresholdPct').textContent = Math.round(s.threshold * 100) + '%';
		for (const k of ['attack_ms', 'hold_ms', 'release_ms']) if (document.activeElement !== $(k)) $(k).value = s[k];

		const current = ruleOf();
		if (draftFor !== (current ? current.id : 0)) openEditor(current);
		renderStatus();
	}

	function renderStatus() {
		const r = ruleOf();
		const ducking = r && r.enabled && live.active_rules.includes(r.id);
		$('status').textContent = !r ? 'New rule: pick the apps, then Create.' : !r.enabled ? 'Off. Tap the key to turn it back on.' : ducking ? 'Lowering the volume now.' : 'On, listening.';
	}

	function renderLive() {
		renderStatus();
		// Apps that started playing after the editor opened become pickable (unchecked).
		const fresh = draft ? live.peaks.map(([a]) => a).filter((a) => !draft.sources.some(([s]) => s === a)) : [];
		if (fresh.length) {
			for (const l of [draft.sources, draft.targets]) { l.push(...fresh.map((a) => [a, false])); l.sort((x, y) => x[0].localeCompare(y[0])); }
			renderEditor();
		}
		const apps = $('apps');
		if (!live.peaks.length) { apps.replaceChildren(el('span', { className: 'note', textContent: 'No app is playing audio.' })); return; }
		apps.replaceChildren(...live.peaks.map(([app, peak]) => {
			const g = live.gains[app] ?? 1;
			const v = live.volumes[app];
			const vol = v === undefined ? '' : Math.round(v * g * 100) + '%';
			const loud = config && peak > config.settings.threshold;
			return el('div', { className: 'app' },
				el('span', { className: 'name', textContent: pretty(app), title: app }),
				el('div', { className: 'bar' + (loud ? ' loud' : '') }, el('div', { style: 'width:' + Math.min(100, peak * 100) + '%' })),
				el('span', { className: 'vol' + (g < 0.999 ? ' down' : ''), textContent: g < 0.999 ? '↓ ' + vol : vol }));
		}));
	}

	function openEditor(rule) {
		const r = rule || { id: 0, sources: [], targets: [], all_others: false, level: 0.2, enabled: true };
		const apps = [...new Set([...live.peaks.map(([a]) => a), ...r.sources, ...r.targets])].sort();
		draftFor = r.id;
		draft = { id: r.id, all_others: r.all_others, level: r.level, error: '', saved: false,
			sources: apps.map((a) => [a, r.sources.includes(a)]), targets: apps.map((a) => [a, r.targets.includes(a)]) };
		renderEditor();
	}

	// sdpi checkbox: hidden input + label with an empty span that draws the box.
	function checkbox(checked, text, onchange) {
		const id = 'c' + uid++;
		const c = el('input', { type: 'checkbox', id, checked });
		c.onchange = () => onchange(c.checked);
		const label = el('label', {}, el('span'), text);
		label.htmlFor = id;
		return el('div', { className: 'sdpi-item-child' }, c, label);
	}

	const row = (label, value, type) => {
		const item = el('div', { className: 'sdpi-item' }, el('div', { className: 'sdpi-item-label' + (label ? '' : ' empty'), textContent: label }), value);
		if (type) item.setAttribute('type', type);
		return item;
	};

	function renderEditor() {
		const ed = draft;
		const list = (items) => el('div', { className: 'sdpi-item-value list' }, ...items.map((it) => checkbox(it[1], it[0], (on) => { it[1] = on; ed.saved = false; renderEditor(); })));
		const manual = el('input', { className: 'sdpi-item-value', type: 'text', placeholder: 'e.g. spotify.exe (Enter)' });
		manual.onkeydown = (e) => {
			if (e.key !== 'Enter') return;
			let app = manual.value.trim().toLowerCase();
			if (!app) return;
			if (!app.endsWith('.exe')) app += '.exe';
			for (const l of [ed.sources, ed.targets]) if (!l.some(([a]) => a === app)) l.push([app, false]);
			renderEditor();
		};
		const level = el('input', { type: 'range', min: 0, max: 100, value: Math.round(ed.level * 100), style: 'flex:1;min-width:0;width:auto;' });
		const pct = el('span', { textContent: Math.round(ed.level * 100) + '%', style: 'min-width:3em;' });
		level.oninput = () => { ed.level = level.value / 100; ed.saved = false; pct.textContent = level.value + '%'; };
		const ok = el('button', { className: 'sdpi-item-value', textContent: ed.id ? 'Save' : 'Create rule' });
		ok.onclick = () => {
			const picked = (l) => l.filter(([, c]) => c).map(([a]) => a);
			const sources = picked(ed.sources), targets = picked(ed.targets);
			if (!sources.length) ed.error = 'Pick at least one app that triggers ducking.';
			else if (!ed.all_others && !targets.length) ed.error = 'Pick at least one app to lower.';
			else {
				ed.error = '';
				const isNew = !ed.id;
				if (isNew) ed.id = config.rules.reduce((m, r) => Math.max(m, r.id), 0) + 1;
				const rule = { id: ed.id, sources, targets, all_others: ed.all_others, level: ed.level, enabled: isNew || ruleOf()?.enabled !== false }; // on/off belongs to the key
				const i = config.rules.findIndex((r) => r.id === ed.id);
				if (i < 0) config.rules.push(rule); else config.rules[i] = rule;
				draftFor = ed.id;
				ed.saved = true;
				if (isNew) settings.rule = ed.id; // before save(), so the new rule arrives with its key
				save();
				if (isNew) setRule(ed.id); else renderConfig();
			}
			renderEditor();
		};
		const levelValue = el('div', { className: 'sdpi-item-value' }, level, pct);
		$('editor').replaceChildren(
			row('When', list(ed.sources), 'checkbox'),
			row(ed.all_others ? 'Except' : 'Lower', list(ed.targets), 'checkbox'),
			row('', el('div', { className: 'sdpi-item-value' }, checkbox(ed.all_others, 'Lower all other apps', (on) => { ed.all_others = on; ed.saved = false; renderEditor(); })), 'checkbox'),
			row('Other app', manual),
			row('Volume', levelValue, 'range'),
			ed.error ? row('', el('div', { className: 'sdpi-item-value error', textContent: ed.error })) : '',
			row('', ok),
			ed.saved ? row('', el('div', { className: 'sdpi-item-value note', textContent: 'Saved.' })) : '');
	}

	// Style: "default" (stock Stream Deck look) or "duotone" (Duotone Essentials colours), as in Foreground Boost.
	function styleToUi() {
		$('style').value = settings.style === 'duotone' ? 'duotone' : 'default';
		$('duoPreset').value = settings.duoPreset || 'blue';
		$('duoBg').value = settings.duoBg || '#3b4c66';
		$('duoAccent').value = settings.duoAccent || '#67a4ff';
		const duo = $('style').value === 'duotone';
		$('duoItem').style.display = duo ? '' : 'none';
		$('duoCustom').style.display = duo && $('duoPreset').value === 'custom' ? '' : 'none';
	}
	for (const id of ['style', 'duoPreset', 'duoBg', 'duoAccent']) $(id).addEventListener('change', () => { settings[id] = $(id).value; styleToUi(); saveSettings(); });

	$('threshold').oninput = () => { config.settings.threshold = $('threshold').value / 100; $('thresholdPct').textContent = $('threshold').value + '%'; };
	$('threshold').onchange = save;
	for (const k of ['attack_ms', 'hold_ms', 'release_ms']) {
		$(k).onchange = () => { config.settings[k] = Math.max(0, Math.min(5000, parseInt($(k).value) || 0)); save(); };
	}
</script>
</body>
</html>
